name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate agent files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check agent counts
        run: npm run check:counts

      - name: Lint agent structure
        run: bash scripts/lint-agents.sh

      - name: Validate agent files and Search Growth registry
        run: npm run search-growth -- agents validate

      - name: Check for broken internal links
        run: |
          ERRORS=0
          while read -r link; do
            if [ ! -f "$link" ]; then
              echo "::error file=README.md::Broken link: $link"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(grep -oP '(?<=\]\()(?!http)[^)]+\.md' README.md)
          exit $ERRORS
